name: Godot Smoke

on:
  push:
    branches:
      - "dev/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Run runtime smoke harness
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://tests/test_runner.gd 2>&1 | tee godot-smoke.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            echo "Godot exited with status $godot_status"
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-smoke.log; then
            echo "Godot emitted script/engine errors even though the process returned zero."
            exit 1
          fi
          grep -F 'PASS: PlayWorld Studio test harness completed.' godot-smoke.log

      - name: Upload runtime smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-log
          path: godot-smoke.log
          if-no-files-found: error
          retention-days: 1

  phase1-visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Capture rendered Phase 1 UI
        shell: bash
        run: |
          set -uo pipefail
          set +e
          xvfb-run -a ./Godot_v4.7.1-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --disable-vsync \
            --script res://tests/runtime/capture_phase1.gd 2>&1 | tee godot-visual.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' godot-visual.log; then
            echo "Godot emitted script/engine errors during visual capture."
            exit 1
          fi
          grep -F 'PASS: Phase 1 rendered screenshots captured.' godot-visual.log
          cp assets/reference/CANONICAL_UI_REFERENCE.png artifacts/phase1/00-canonical-reference.png
          file artifacts/phase1/*.png

      - name: Upload Phase 1 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-visual-evidence
          path: artifacts/phase1/*.png
          if-no-files-found: error
          retention-days: 14
