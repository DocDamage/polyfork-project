name: Phase 8 Contracts

on:
  push:
    branches:
      - dev/phase8-visual-scripting-milestone
  pull_request:
    branches:
      - master

jobs:
  phase8-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version
      - name: Run Phase 8 foundation contracts
        shell: bash
        env:
          PHASE8_SUITE: foundation
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 150s \
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . \
            --script res://tests/phase8_suite_runner.gd 2>&1 | tee phase8-foundation.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then exit "$godot_status"; fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' phase8-foundation.log; then exit 1; fi
          grep -F "PASS: Phase 8 foundation contract suite completed." phase8-foundation.log
      - name: Upload Phase 8 foundation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-foundation-log
          path: phase8-foundation.log
          if-no-files-found: error
          retention-days: 14
