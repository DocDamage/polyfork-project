name: Phase 7 Contracts

on:
  push:
    branches:
      - "dev/phase7-instant-play-templates-milestone"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-contracts:
    name: phase7-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [templates, play]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Run Phase 7 ${{ matrix.suite }} contracts
        shell: bash
        env:
          PHASE7_SUITE: ${{ matrix.suite }}
        run: |
          set -uo pipefail
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . \
            --script res://tests/phase7_suite_runner.gd 2>&1 | tee phase7-${{ matrix.suite }}.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then exit "$godot_status"; fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' phase7-${{ matrix.suite }}.log; then
            echo "Godot emitted script/engine errors during Phase 7 ${{ matrix.suite }} verification."
            exit 1
          fi
          grep -F "PASS: Phase 7 ${{ matrix.suite }} contract suite completed." phase7-${{ matrix.suite }}.log

      - name: Upload Phase 7 contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-${{ matrix.suite }}-log
          path: phase7-${{ matrix.suite }}.log
          if-no-files-found: error
          retention-days: 14
