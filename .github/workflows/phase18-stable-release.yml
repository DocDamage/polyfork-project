name: Phase 18 Stable Release

# Compatibility bridge for repository rules that still require the accepted
# Phase 18 job names. The immutable 0.1.0 evidence remains in PHASE18_QA.md;
# current source validation is delegated to real Phase 19 contracts.
on:
  push:
    branches:
      - dev/phase19-completion-correction
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase18-compatibility-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWORLD_DISABLE_UPDATE_NETWORK: '1'

jobs:
  source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 19 source and security contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography
          python -m py_compile tools/release/*.py
          python tools/release/scan_phase19_security.py src config tools tests/fixtures/phase19 docs
          python tools/release/verify_update_manifest.py tests/fixtures/phase19/accepted-update.json \
            --registry tests/fixtures/phase19/test_keys.json --channel development \
            --current-version 0.1.0 --now-unix 1786665600
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version
      - name: Run Phase 19 and inherited product regressions
        shell: bash
        run: |
          set -euo pipefail
          GODOT=./Godot_v4.7.1-stable_linux.x86_64
          run_gate() {
            local script="$1" marker="$2" log="$3"
            set +e
            timeout --signal=TERM --kill-after=10s 480s "$GODOT" --headless --path . --script "$script" 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then return "$status"; fi
            if grep -Ev '^ERROR: 1 resources still in use at exit \(run with --verbose for details\)\.$' "$log" | grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:'; then return 1; fi
            grep -F "$marker" "$log"
          }
          timeout 480s "$GODOT" --headless --path . --import 2>&1 | tee phase18-bridge-import.log
          if grep -Ev '^ERROR: 1 resources still in use at exit \(run with --verbose for details\)\.$' phase18-bridge-import.log | grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:'; then exit 1; fi
          run_gate res://tests/phase19_contracts_runner.gd \
            'PASS: Phase 19 update, signature, channel, migration, recovery, diagnostics, and UI contracts completed.' \
            phase18-bridge-phase19.log
          run_gate res://tests/test_runner.gd \
            'PASS: PlayWorld Studio test harness completed.' \
            phase18-bridge-smoke.log
          PHASE16_SUITE=product run_gate res://tests/phase16_suite_runner.gd \
            'PASS: Phase 16 product contract suite completed.' \
            phase18-bridge-phase16-product.log
          PHASE16_SUITE=integration run_gate res://tests/phase16_suite_runner.gd \
            'PASS: Phase 16 integration contract suite completed.' \
            phase18-bridge-phase16-integration.log
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-source-regression-compatibility-evidence
          path: 'phase18-bridge-*.log'
          if-no-files-found: error
          retention-days: 21

  windows-stable-release:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the external updater helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish tools/updater/PlayWorldUpdater/PlayWorldUpdater.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o artifacts/phase18-bridge/updater
          $helper = Join-Path $env:GITHUB_WORKSPACE 'artifacts\phase18-bridge\updater\PlayWorldUpdater.exe'
          if (-not (Test-Path $helper)) { throw 'PlayWorldUpdater.exe was not produced.' }
          "PHASE18_BRIDGE_UPDATER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Godot 4.7.1 and Windows export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip' -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz' -OutFile templates.tpz
          Copy-Item templates.tpz templates.zip
          Expand-Archive templates.zip -DestinationPath template-package
          $templateTarget = Join-Path $env:APPDATA 'Godot\export_templates\4.7.1.stable'
          New-Item -ItemType Directory -Force -Path $templateTarget | Out-Null
          Copy-Item 'template-package\templates\*' $templateTarget -Recurse -Force
          $console = (Get-ChildItem godot -Filter '*_console.exe' | Select-Object -First 1).FullName
          $editor = (Get-ChildItem godot -Filter '*.exe' | Where-Object { $_.Name -notlike '*_console.exe' } | Select-Object -First 1).FullName
          if (-not $console -or -not $editor) { throw 'Godot executables not found.' }
          "GODOT_EXE=$console" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GODOT_EDITOR_EXE=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GODOT_TEMPLATE_ROOT=$templateTarget" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run Phase 19 and inherited Windows contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($gate in @(
            @('res://tests/phase19_contracts_runner.gd','phase18-bridge-phase19-windows.log'),
            @('res://tests/phase16_windows_export_runner.gd','phase18-bridge-phase16-export.log')
          )) {
            & $env:GODOT_EXE --headless --path . --script $gate[0] 2>&1 | Tee-Object $gate[1]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $text = Get-Content $gate[1] -Raw
            $strictText = ($text -split "`r?`n" | Where-Object { $_ -ne 'ERROR: 1 resources still in use at exit (run with --verbose for details).' }) -join "`n"
            if ($strictText -match 'SCRIPT ERROR:|(^|\s)ERROR:') { throw "Strict Godot error in $($gate[1])" }
          }
      - name: Build and validate a current 0.2.0 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $epoch = [int64](git show -s --format=%ct $env:GITHUB_SHA)
          python tools/release/build_creator_release.py --godot "$env:GODOT_EDITOR_EXE" --template-root "$env:GODOT_TEMPLATE_ROOT" --updater-helper "$env:PHASE18_BRIDGE_UPDATER" --output-root artifacts/phase18-bridge/release --source-commit "$env:GITHUB_SHA" --source-date-epoch $epoch 2>&1 | Tee-Object phase18-bridge-package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Join-Path $env:GITHUB_WORKSPACE 'artifacts\phase18-bridge\release\PlayWorld-Studio-0.2.0-Windows-x64'
          python tools/release/validate_creator_package.py "$package" 2>&1 | Tee-Object phase18-bridge-package-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-windows-stable-release-compatibility-evidence
          path: |
            phase18-bridge-*.log
            artifacts/phase18-bridge/release/*.zip
            artifacts/phase18-bridge/release/*.sha256
          if-no-files-found: warn
          retention-days: 21
