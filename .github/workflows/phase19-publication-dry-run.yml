name: Phase 19 Publication Dry Run

on:
  push:
    branches:
      - dev/phase19-completion-correction
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-and-publication-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Generate an ephemeral signing key outside the repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          root=Path('/tmp/phase19-publication-dry-run'); root.mkdir(parents=True,exist_ok=True)
          key=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          (root/'private.pem').write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          public=key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo).decode()
          registry={'schema_version':1,'keys':[{'key_id':'dry-run','algorithm':'rsa-sha256','enabled':True,'revoked':False,'channels':['development'],'not_before_unix':0,'not_after_unix':0,'public_key_pem':public}]}
          (root/'registry.json').write_text(json.dumps(registry,indent=2)+'\n')
          (root/'portable.zip').write_bytes(b'portable-dry-run')
          (root/'installer.exe').write_bytes(b'installer-dry-run')
          (root/'notes.md').write_text('Phase 19 publication workflow dry run. No GitHub Release or tag is created.\n')
          PY
      - name: Build, verify, and tamper-test a signed update manifest without publishing
        shell: bash
        run: |
          set -euo pipefail
          python tools/release/build_update_manifest.py \
            --channel development --key-id dry-run --private-key /tmp/phase19-publication-dry-run/private.pem \
            --source-commit "$GITHUB_SHA" --release-notes /tmp/phase19-publication-dry-run/notes.md \
            --portable /tmp/phase19-publication-dry-run/portable.zip --portable-url https://github.com/DocDamage/polyfork-project/releases/download/dry-run/portable.zip \
            --installer /tmp/phase19-publication-dry-run/installer.exe --installer-url https://github.com/DocDamage/polyfork-project/releases/download/dry-run/installer.exe \
            --output /tmp/phase19-publication-dry-run/update.json --published-at-unix 1786665600
          python tools/release/verify_update_manifest.py /tmp/phase19-publication-dry-run/update.json --registry /tmp/phase19-publication-dry-run/registry.json --channel development --current-version 0.1.0 --now-unix 1786665600
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/phase19-publication-dry-run/update.json')
          value=json.loads(p.read_text()); value['signature']='A'+value['signature'][1:]; p.write_text(json.dumps(value))
          PY
          if python tools/release/verify_update_manifest.py /tmp/phase19-publication-dry-run/update.json --registry /tmp/phase19-publication-dry-run/registry.json --channel development --current-version 0.1.0 --now-unix 1786665600; then
            echo 'Tampered dry-run manifest was accepted.' >&2
            exit 1
          fi
          if git status --porcelain | grep .; then
            echo 'Publication dry run modified the repository.' >&2
            exit 1
          fi
          echo 'PASS: Publication dry run completed without creating a GitHub Release or tag.'
