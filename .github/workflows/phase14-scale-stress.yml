name: Phase 14 Scale Stress

on:
  push:
    branches:
      - dev/phase14-scale-polish-milestone
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  small-medium-large-stress:
    name: small-medium-large-stress
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version
      - name: Run Phase 14 scale stress smoke
        shell: bash
        run: |
          set -uo pipefail; set +e
          timeout --signal=TERM --kill-after=10s 300s \
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . \
            --script res://tests/runtime/phase14_scale_stress.gd 2>&1 | tee phase14-scale-stress.log
          godot_status=${PIPESTATUS[0]}; set -e
          if [ "$godot_status" -ne 0 ]; then exit "$godot_status"; fi
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:' phase14-scale-stress.log; then exit 1; fi
          grep -F 'PASS: Phase 14 Small/Medium/Large/Stress scale smoke completed.' phase14-scale-stress.log
      - name: Upload Phase 14 scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-scale-stress-evidence
          path: |
            phase14-scale-stress.log
            artifacts/phase14/scale-stress-report.json
          if-no-files-found: warn
          retention-days: 14
